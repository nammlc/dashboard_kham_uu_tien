<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập · BVĐK Tâm Đức Cầu Quan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#0f2642] via-[#1e3f6a] to-[#0f2642] flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl p-8">

    <!-- Logo -->
    <div class="flex items-center gap-3 mb-7">
      <div class="w-11 h-11 bg-[#0f2642] rounded-xl flex items-center justify-center text-2xl flex-shrink-0">🏥</div>
      <div>
        <p class="font-bold text-[#0f2642] text-sm leading-tight">BVĐK Tâm Đức Cầu Quan</p>
        <p class="text-slate-400 text-xs">Hệ thống theo dõi đặt khám trực tuyến</p>
      </div>
    </div>

    <!-- Flash errors -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="mb-4 text-sm px-4 py-3 rounded-lg
             {% if cat == 'error' %}bg-red-50 text-red-700 border border-red-200
             {% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
          {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    <!-- Google OAuth -->
    <a href="{{ url_for('login_google') }}"
       class="w-full flex items-center justify-center gap-3 border border-slate-300
              rounded-lg px-4 py-2.5 text-sm font-medium text-slate-700
              hover:bg-slate-50 transition-colors mb-5">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Đăng nhập bằng Google
    </a>

    <div class="relative mb-5">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
      <div class="relative flex justify-center"><span class="bg-white px-3 text-xs text-slate-400">hoặc</span></div>
    </div>

    <!-- Email/Password form -->
    <form method="POST">
      <div class="mb-4">
        <label class="block text-sm font-semibold text-slate-600 mb-1.5">Email</label>
        <input type="email" name="email" required autocomplete="email"
               placeholder="admin@bvtd.vn"
               class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm
                      focus:outline-none focus:border-[#2a7ae4] focus:ring-2 focus:ring-[#2a7ae4]/20">
      </div>
      <div class="mb-5">
        <label class="block text-sm font-semibold text-slate-600 mb-1.5">Mật khẩu</label>
        <input type="password" name="password" required autocomplete="current-password"
               placeholder="••••••••"
               class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm
                      focus:outline-none focus:border-[#2a7ae4] focus:ring-2 focus:ring-[#2a7ae4]/20">
      </div>
      <button type="submit"
              class="w-full bg-[#0f2642] text-white rounded-lg py-2.5 text-sm font-semibold
                     hover:bg-[#1e3f6a] transition-colors">
        Đăng nhập
      </button>
    </form>

    <p class="text-center text-xs text-slate-400 mt-6">© 2026 BVĐK Tâm Đức Cầu Quan</p>
  </div>
</body>
</html>
