{# Thanh 2 tab con của mục Tin nhắn SMS — bấm chuyển qua lại. Dùng: {% from "sms/_tabs.html" import tabs %}{{ tabs('appointment') }} #}
{% macro tabs(active) -%}
<div class="mb-5 flex flex-wrap gap-2" role="tablist" aria-label="Loại tin nhắn">
  <a href="{{ url_for('sms_index') }}" role="tab" aria-selected="{{ 'true' if active == 'appointment' else 'false' }}"
     class="inline-flex items-center gap-2 text-sm font-semibold px-5 py-2.5 rounded-xl border transition-colors
            {% if active == 'appointment' %}bg-[#0f2642] text-white border-[#0f2642] shadow-sm{% else %}bg-white text-slate-600 border-slate-300 hover:bg-slate-50{% endif %}">
    📅 Nhắc lịch hẹn khám</a>
  <a href="{{ url_for('sms_events') }}" role="tab" aria-selected="{{ 'true' if active == 'mobile' else 'false' }}"
     class="inline-flex items-center gap-2 text-sm font-semibold px-5 py-2.5 rounded-xl border transition-colors
            {% if active == 'mobile' %}bg-[#0f2642] text-white border-[#0f2642] shadow-sm{% else %}bg-white text-slate-600 border-slate-300 hover:bg-slate-50{% endif %}">
    🚑 Nhắc lịch khám lưu động</a>
</div>
{%- endmacro %}
